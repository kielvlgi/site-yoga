<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Покупка абонемента</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">

    <h1>Покупка абонемента</h1>

    <form>

        <input type="text" placeholder="Ваше имя" required>

        <input type="tel" placeholder="Телефон" required>

        <input type="email" placeholder="Email" required>

        <select required>
            <option>Выберите абонемент</option>
            <option>Одно занятие</option>
            <option>8 занятий</option>
            <option>Безлимит</option>
        </select>

        <button type="submit">
            Купить
        </button>

    </form>

</div>

</body>
</html>
