<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Абонементы VINET</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Jost:ital,wght@0,100..900;1,100..900&family=Pattaya&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            VINET
        </div>

        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="practic.html">Практики</a>
            <a href="tarif.html">Абонементы</a>
            <a href="teachers.html">Преподаватели</a>
        </nav>

    </header>

    <!-- ЗАГОЛОВОК -->

    <section class="page-title">

        <h1>Абонементы</h1>

    </section>

    <!-- КАРТОЧКИ -->
    <section class="pricing">

        <div class="price-card">
            <h3>Разовое занятие</h3>
            <p class="desc">Подходит для первого знакомства</p>
            <p class="price">700 ₽</p>
            <button class="buy-btn" onclick="openModal()">Записаться</button>
        </div>

        <div class="price-card popular">
            <div class="badge">Популярный</div>

            <h3>8 занятий</h3>
            <p class="desc">Лучший выбор для регулярной практики</p>
            <p class="price">5400 ₽</p>
            <button class="buy-btn" onclick="openModal()">Записаться</button>
        </div>

        <div class="price-card">
            <h3>Безлимит</h3>
            <p class="desc">Максимальная свобода практики</p>
            <p class="price">10000 ₽</p>
            <button class="buy-btn" onclick="openModal()">Записаться</button>
        </div>

    </section>

    <!-- POPUP -->

    <div id="buyModal" class="modal">

        <div class="modal-content">

            <span class="close" onclick="closeModal()">
                &times;
            </span>

            <h2>Покупка абонемента</h2>

            <form>

                <input type="text" placeholder="Ваше имя" required>

                <input type="tel" placeholder="Телефон" required>

                <input type="email" placeholder="Email" required>

                <select required>

                    <option>Выберите абонемент</option>

                    <option>Одно занятие</option>

                    <option>8 занятий</option>

                    <option>Безлимитный месяц</option>

                </select>

                <button type="submit">
                    Отправить
                </button>

            </form>

        </div>

    </div>

    <!-- FOOTER -->

    <footer>

        <p>© 2026 VINET Studio</p>

    </footer>

    <!-- SCRIPT -->

    <script>

        function openModal() {
            document.getElementById("buyModal").style.display = "block";
        }

        function closeModal() {
            document.getElementById("buyModal").style.display = "none";
        }

        window.onclick = function(event) {

            let modal = document.getElementById("buyModal");

            if(event.target == modal) {
                modal.style.display = "none";
            }
        }

    </script>

</body>

</html>
